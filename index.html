<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Página Caída</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ejercicio: Página Caída</h1>
    <p class="subtitulo">Práctica de trabajo colaborativo con Git y GitHub</p>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Estado del sitio</h2>
      <p id="estado">Comprobando...</p>
    </section>

    <section class="tarjeta">
      <h2>Contador de visitas (local)</h2>
      <p>Has abierto esta página <strong id="contador">0</strong> veces.</p>
      <button id="btn-reiniciar">Reiniciar contador</button>
    </section>

    <section class="tarjeta">
      <h2>Equipo</h2>
      <ul>
        <li>Julio Ticas — dueño del repositorio</li>
        <li>Compañero — colaborador</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Publicado con GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
